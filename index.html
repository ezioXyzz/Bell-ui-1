<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101925" />
  <meta name="description" content="Ezioz E-Bell school operations console." />
  <title>Ezioz E-Bell — School Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="photo-backdrop" aria-hidden="true"></div>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="Ezioz E-Bell Overview">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4.5c-5.2 0-8.4 3.8-8.4 9v5.1L5 22v1.5h22V22l-2.6-3.4v-5.1c0-5.2-3.2-9-8.4-9Z"/><path d="M12.8 26a3.3 3.3 0 0 0 6.4 0"/><path d="M16 9v6m0 3.2h.01"/></svg></span>
        <span class="brand-copy"><strong>ezioz<span>.</span></strong><small>E-BELL CONTROL</small></span>
      </a>
      <div class="rail-label">OPERATIONS</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span>Overview<span class="nav-arrow">›</span></button>
        <button class="nav-item" data-page="schedules"><span class="nav-icon">▦</span>Schedules</button>
        <button class="nav-item" data-page="manual"><span class="nav-icon">◉</span>Manual</button>
        <button class="nav-item" data-page="sounds"><span class="nav-icon">♫</span>Sounds</button>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Advanced Settings<span class="lock-mark">●</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection-card">
          <div class="connection-head"><span class="status-dot green"></span><span>System connected</span><span class="live-pulse"></span></div>
          <div class="connection-row"><span>Speaker output</span><b>Main School PA</b></div>
          <div class="connection-row"><span>Scheduler</span><b class="sched-label">ACTIVE</b></div>
        </div>
        <div class="sidebar-meta"><span>v2.4.1 <i>•</i> Windows</span><span>UPTIME <b>14d 06h 32m</b></span></div>
        <div class="operator"><span class="operator-avatar">OA</span><span><b>Operator</b><small>Local administrator</small></span><span class="operator-menu">···</span></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>School Operations</span><span class="crumb-slash">/</span><b id="crumb-current">Overview</b></div>
        <div class="topbar-right"><span class="system-chip"><i class="status-dot green"></i><span id="top-status">Scheduler active</span></span><button class="icon-button notification" aria-label="Notifications" title="Notifications"><span>♧</span><i></i></button><span class="top-separator"></span><span class="top-date" id="top-date">SAT, NOV 21</span></div>
      </header>
      <div id="page-content" class="page-content" tabindex="-1"></div>
    </main>
  </div>
  <button class="emergency-edge" id="emergency-stop" aria-label="Emergency stop"><span class="emergency-symbol">Ⅱ</span><span>EMERGENCY STOP</span></button>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div></div>
  <script src="app.js" defer></script>
</body>
</html>
